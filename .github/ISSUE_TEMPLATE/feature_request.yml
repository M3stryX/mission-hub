name: Feature request
description: Propose a new capability or surface for Mission Hub
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature. Please describe the problem and the
        proposed solution. **Do not paste secrets, tokens, or `.env` values.**
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What is the current limitation?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the capability you would like to see.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which surface would this affect?
      options:
        - REST only
        - MCP only
        - Both REST and MCP (parity)
        - Not sure
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you have considered, if any.
    validations:
      required: false
