name: CI

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main, "feature/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mission_hub
          POSTGRES_PASSWORD: mission_hub_test
          POSTGRES_DB: mission_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mission_hub -d mission_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://mission_hub:mission_hub_test@localhost:5432/mission_hub_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeCheck
        run: pnpm typecheck

      - name: Docs links
        run: pnpm docs:links

      - name: Migrate ephemeral PostgreSQL (fresh)
        run: pnpm db:migrate

      - name: Migrate ephemeral PostgreSQL (idempotent second boot)
        run: pnpm db:migrate

      - name: Import representative legacy fixture
        run: pnpm legacy:import tests/fixtures/legacy-export.json

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Docker build
        run: docker build -t mission-hub:ci .
